name: Автопостинг статей

on:
  schedule:
    - cron: '0 5 * * *'   # каждый день 08:00 МСК — публикация статей, у которых наступила дата
    - cron: '0 6 * * 1'   # понедельник 09:00 МСК — генерация новых черновиков через Claude
  push:
    branches: [main]
    paths: ['content/articles/**', 'scripts/build-blog.mjs']
  workflow_dispatch:
    inputs:
      generate:
        description: 'Сгенерировать новые статьи (сколько; 0 — не генерировать)'
        default: '0'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency: autopost

jobs:
  publish:
    if: github.event.schedule != '0 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - name: Обложки
        run: python3 scripts/make-cover.py
      - name: Сборка блога и RSS для Дзена
        run: node scripts/build-blog.mjs
      - name: Коммит (Vercel задеплоит автоматически)
        run: |
          git config user.name "grantovik-bot"
          git config user.email "bot@users.noreply.github.com"
          git add blog rss data/published.json
          git diff --cached --quiet || (git commit -m "blog: автопубликация $(date -u +%F)" && git push)
      - name: Задачи на публикацию в VC.ru
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create autopost --color D7261E --force >/dev/null 2>&1 || true
          while read -r slug; do
            [ -z "$slug" ] && continue
            gh issue create \
              --title "$(cat .autopost/issues/$slug.title)" \
              --body-file ".autopost/issues/$slug.md" \
              --label autopost
          done < .autopost/new.txt

  generate:
    if: github.event.schedule == '0 6 * * 1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.generate != '0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Генерация статей
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/generate-article.mjs ${{ github.event.inputs.generate || 3 }}
      - name: Pull Request на проверку
        uses: peter-evans/create-pull-request@v6
        with:
          branch: autopost/drafts
          title: 'Новые статьи на проверку'
          commit-message: 'content: новые статьи из очереди тем'
          add-paths: |
            content/articles
            data/topics-used.json
          body: |
            Статьи сгенерированы автоматически и стоят в расписании (дата в каждом файле).
            **Перед мёржем:** проверьте цифры, названия программ и сроки — особенно у статей, помеченных «без веб-поиска».
            После мёржа каждая статья выйдет на сайте и в Дзене в свою дату, а в Issues появится задача на VC.ru.
          labels: autopost
